name: CodeQL

# Rust, C# and workflows on every push (fast, no build). Swift: codeql-swift.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

# Superseded runs on PRs/branches are cancelled; every push to main gets a complete run.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The analyze step reads its own workflow run (required on private repositories).
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: rust, os: ubuntu-latest, build-mode: none }
          - { language: csharp, os: ubuntu-latest, build-mode: none }
          - { language: actions, os: ubuntu-latest, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          # Private repos without GitHub Advanced Security can't receive code-scanning uploads;
          # keep the SARIF as an artifact instead.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results/
          if-no-files-found: ignore
